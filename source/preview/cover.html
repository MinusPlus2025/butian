<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Cormorant+Garamond:ital,wght@1,500&family=Noto+Serif+SC:wght@500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#111}
.bg{position:absolute;inset:0;background:url(bg.jpg) center/cover;filter:saturate(1.1) contrast(1.05)}
.v1{position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,6,4,.92) 0%,rgba(8,6,4,.7) 30%,rgba(8,6,4,.1) 60%,rgba(0,0,0,0) 100%)}
.v2{position:absolute;inset:0;background:radial-gradient(ellipse at 72% 50%,rgba(0,0,0,0) 40%,rgba(0,0,0,.65) 100%),linear-gradient(0deg,rgba(0,0,0,.85) 0%,rgba(0,0,0,0) 35%)}
.wrap{position:absolute;left:130px;top:170px;color:#f3e6c8}
.title{font-family:'Ma Shan Zheng';font-size:330px;line-height:1;letter-spacing:20px;text-shadow:0 0 50px rgba(230,150,60,.45),0 6px 18px rgba(0,0,0,.8);display:flex;align-items:flex-start}
.seal{font-family:'Ma Shan Zheng';font-size:58px;color:#fff3e6;background:#b3261e;width:84px;height:84px;display:flex;align-items:center;justify-content:center;border-radius:8px;margin:40px 0 0 24px;box-shadow:0 4px 14px rgba(0,0,0,.6)}
.en{font-family:'Cormorant Garamond';font-style:italic;font-size:76px;margin-top:6px;color:#e9cf98;letter-spacing:3px}
.tag{font-family:'Noto Serif SC';font-size:42px;margin-top:40px;letter-spacing:6px;color:#f6ecd6}
.tagen{font-family:'Cormorant Garamond';font-style:italic;font-size:34px;color:#cdb98e;margin-top:8px}
.wx{display:flex;gap:22px;margin-top:54px}
.wx div{width:74px;height:74px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Ma Shan Zheng';font-size:46px;color:#fff;box-shadow:0 0 22px currentColor;border:2px solid rgba(255,255,255,.5)}
.cr{position:absolute;left:130px;bottom:60px;font-family:'Cormorant Garamond';font-style:italic;font-size:30px;color:#bfae88;letter-spacing:2px}
</style></head><body>
<div class="bg"></div><div class="v1"></div><div class="v2"></div>
<div class="wrap">
<div class="title">补天<div class="seal">礼</div></div>
<div class="en">Mending the Sky</div>
<div class="tag">天塌了，洪水不息。你是女娲。</div>
<div class="tagen">The sky has broken. The flood will not stop. You are Nüwa.</div>
<div class="wx"><div style="background:#3f8f4e">木</div><div style="background:#c8402c">火</div><div style="background:#b8862e">土</div><div style="background:#9aa3ad">金</div><div style="background:#2f6fb0">水</div></div>
</div>
<div class="cr">World Labs Marble · Tripo 3D · Tripothon S1</div>
</body></html>
